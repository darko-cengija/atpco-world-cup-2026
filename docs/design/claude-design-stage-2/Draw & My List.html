<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World Cup 26 — Draw &amp; My List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  input::placeholder { color: rgba(15,58,53,0.45); }
  @keyframes tkSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes tkPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

  .board {
    background: #f6efdb;
    background-image: radial-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
                      radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1.5px 1.5px;
    border-radius: 14px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.05), 0 8px 22px rgba(50,30,10,0.10);
    padding: 22px;
    height: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .board-eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase;
    color: rgba(15,58,53,0.5); font-weight: 600;
  }
  .board-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px; letter-spacing: -0.3px; color: #0f3a35;
    line-height: 1.05; margin-top: 4px;
  }
  .board-divider {
    height: 1px; border: none; border-top: 1px dashed rgba(15,58,53,0.2);
    margin: 14px 0 16px;
  }
  .vstack { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="concept-ticket.jsx"></script>
<script type="text/babel" src="ds-icons.jsx"></script>
<script type="text/babel" src="ds-shell.jsx"></script>
<script type="text/babel" src="ds-controls.jsx"></script>
<script type="text/babel" src="ds-patterns.jsx"></script>

<script type="text/babel" src="data-draw.jsx"></script>
<script type="text/babel" src="screens-mylist.jsx"></script>
<script type="text/babel" src="screens-draw-setup.jsx"></script>
<script type="text/babel" src="screens-draw-live.jsx"></script>

<script type="text/babel" src="draw-app.jsx"></script>
</body>
</html>
